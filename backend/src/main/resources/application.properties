spring.application.name=healthcare-epcr-backend
server.port=${PORT:${SERVER_PORT:9091}}
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}


# MongoDB Configuration
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/healthcare_epcr}
spring.mongodb.database=${MONGODB_DATABASE:healthcare_epcr}
spring.mongodb.auto-index-creation=false

# Backward compatibility (older Spring Boot lines)
spring.data.mongodb.uri=${spring.mongodb.uri}
spring.data.mongodb.database=${spring.mongodb.database}
spring.data.mongodb.auto-index-creation=${spring.mongodb.auto-index-creation}

# Server Configuration
server.error.include-message=always
server.error.include-binding-errors=always

# Logging
logging.level.root=INFO
logging.level.com.healthcare=DEBUG

# OpenAPI/Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Auth/JWT
auth.jwt.secret=${JWT_SECRET}
auth.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
auth.refresh.expiration-ms=${REFRESH_EXPIRATION_MS:604800000}
auth.session.cache.enabled=${AUTH_SESSION_CACHE_ENABLED:true}
auth.jwt.cookie-name=${JWT_COOKIE_NAME:access_token}
auth.refresh.cookie-name=${REFRESH_COOKIE_NAME:refresh_token}
auth.jwt.cookie-path=${JWT_COOKIE_PATH:/api}
auth.jwt.cookie-http-only=${JWT_COOKIE_HTTP_ONLY:true}
auth.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
auth.jwt.cookie-same-site=${JWT_COOKIE_SAME_SITE:Lax}

# Redis session cache
spring.data.redis.url=${REDIS_URL:redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.redis.url=${spring.data.redis.url}
spring.redis.host=${spring.data.redis.host}
spring.redis.port=${spring.data.redis.port}
spring.redis.password=${spring.data.redis.password}
patient.search.cache.enabled=${PATIENT_SEARCH_CACHE_ENABLED:true}
patient.search.cache.ttl-seconds=${PATIENT_SEARCH_CACHE_TTL_SECONDS:180}
epcr.record.cache.enabled=${EPCR_RECORD_CACHE_ENABLED:true}
epcr.record.cache.ttl-seconds=${EPCR_RECORD_CACHE_TTL_SECONDS:300}
patient.history.cache.enabled=${PATIENT_HISTORY_CACHE_ENABLED:true}
patient.history.cache.ttl-seconds=${PATIENT_HISTORY_CACHE_TTL_SECONDS:900}
organization.config.cache.ttl-seconds=${ORGANIZATION_CONFIG_CACHE_TTL_SECONDS:3600}
reports.dashboard-metrics.cache.ttl-seconds=${REPORTS_DASHBOARD_METRICS_CACHE_TTL_SECONDS:600}

# PHI Encryption (32-byte base64 key for AES-256-GCM)
phi.crypto.base64-key=${PHI_CRYPTO_BASE64_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173,http://localhost:5174}

# Rate limiting
ratelimit.requests-per-minute=${RATELIMIT_REQUESTS_PER_MINUTE:100}

# Comma-separated proxy IPs allowed to supply X-Forwarded-For / X-Real-IP.
# Loopback and private network proxy addresses are trusted by default.
security.trusted-proxies=${SECURITY_TRUSTED_PROXIES:}

# Session inactivity timeout (minutes)
security.session.idle-timeout-minutes=${SESSION_IDLE_TIMEOUT_MINUTES:15}
# Cron for nightly session cleanup job (default: 02:00 AM every day)
session.cleanup.cron=${SESSION_CLEANUP_CRON:0 0 2 * * *}

# Critical patient follow-up automation
followup.enabled=${FOLLOWUP_ENABLED:true}
followup.days-after-incident=${FOLLOWUP_DAYS_AFTER_INCIDENT:7}
followup.scheduler.cron=${FOLLOWUP_SCHEDULER_CRON:0 0 8 * * *}
followup.scheduler.zone=${FOLLOWUP_SCHEDULER_ZONE:Asia/Kolkata}
followup.max-daily-emails=${FOLLOWUP_MAX_DAILY_EMAILS:500}
followup.max-incident-age-days=${FOLLOWUP_MAX_INCIDENT_AGE_DAYS:14}

# Home & Community Care Scheduler
homecare.scheduler.cron=${HOMECARE_SCHEDULER_CRON:0 0 1 * * *}
homecare.scheduler.missedCron=${HOMECARE_MISSED_CRON:0 30 23 * * *}
homecare.scheduler.zone=${HOMECARE_SCHEDULER_ZONE:Asia/Kolkata}


# Actuator
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=when-authorized
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.info.git.mode=full

# Request size limits
server.tomcat.max-http-post-size=10485760
server.tomcat.max-http-header-size=8192
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:100MB}

# Logging patterns
logging.level.com.healthcare.epcr=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# OTP delivery configuration
otp.expiry-minutes=${OTP_EXPIRY_MINUTES:5}
otp.sms.api-url=${OTP_SMS_API_URL:}
otp.sms.api-key=${OTP_SMS_API_KEY:}

# Demo data loading
app.demo-data.enabled=${APP_DEMO_DATA_ENABLED:false}
app.seed-demo-data=${APP_SEED_DEMO_DATA:false}
app.legacy-demo-loader.enabled=${APP_LEGACY_DEMO_LOADER_ENABLED:false}
app.real-life-demo-data.enabled=${APP_REAL_LIFE_DEMO_DATA_ENABLED:false}

# SMTP / JavaMail Configuration (fallback sender)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL_ENABLE:false}

# Resend email configuration
resend.api.key=${RESEND_API_KEY:}
resend.from.email=${RESEND_FROM_EMAIL:onboarding@resend.dev}

# ─────────────────────────────────────────────────────────────────────────────
# Supabase Storage (S3-compatible)
# ─────────────────────────────────────────────────────────────────────────────
# From Supabase Dashboard → Storage → Settings → S3 Access
# endpoint  : https://<project-id>.supabase.co/storage/v1/s3
# access-key: the S3 access key shown in the dashboard
# secret-key: the S3 secret key shown in the dashboard
# region    : any value (Supabase ignores it, but the SDK requires it)
# bucket    : name of the private bucket you created for patient documents
# signed-url-ttl-minutes: how long pre-signed URLs stay valid (default = 15)
supabase.s3.endpoint=${SUPABASE_S3_ENDPOINT:https://your-project-id.supabase.co/storage/v1/s3}
supabase.s3.access-key=${SUPABASE_S3_ACCESS_KEY:your-access-key}
supabase.s3.secret-key=${SUPABASE_S3_SECRET_KEY:your-secret-key}
supabase.s3.region=${SUPABASE_S3_REGION:ap-south-1}
supabase.s3.bucket=${SUPABASE_S3_BUCKET:patient-documents}
supabase.s3.signed-url-ttl-minutes=${SUPABASE_S3_SIGNED_URL_TTL_MINUTES:15}

# AI Chatbot (Gemini via OpenAI-compatible API)
spring.ai.openai.api-key=${GEMINI_API_KEY:}
spring.ai.openai.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
spring.ai.openai.chat.options.model=${GEMINI_MODEL:gemini-2.5-flash}
spring.ai.openai.chat.options.max-tokens=${GEMINI_MAX_OUTPUT_TOKENS:4096}
spring.ai.openai.chat.options.temperature=${GEMINI_TEMPERATURE:0.2}

# AI suggestions
ai.suggestions.cooldown-minutes=${AI_SUGGESTIONS_COOLDOWN_MINUTES:5}
ai.suggestions.max-attachments=${AI_SUGGESTIONS_MAX_ATTACHMENTS:10}
ai.suggestions.max-attachment-bytes=${AI_SUGGESTIONS_MAX_ATTACHMENT_BYTES:5242880}

# ─────────────────────────────────────────────────────────────────────────────
# HL7 v2+ Configuration (MLLP TCP server)
# ─────────────────────────────────────────────────────────────────────────────
app.hl7.enabled=${APP_HL7_ENABLED:true}
app.hl7.mllp.port=${APP_HL7_PORT:5001}
app.hl7.mllp.host=${APP_HL7_HOST:localhost}

# ─────────────────────────────────────────────────────────────────────────────
# Record Sharing Configuration
# ─────────────────────────────────────────────────────────────────────────────
app.frontend.base-url=${APP_FRONTEND_BASE_URL:https://ihp.ind.in/epcr}
record.share.default-expiry-hours=${RECORD_SHARE_DEFAULT_EXPIRY_HOURS:72}

# ─────────────────────────────────────────────────────────────────────────────
# Razorpay Payment Gateway
# ─────────────────────────────────────────────────────────────────────────────
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_xxxxxxxxxxxxxxxx}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:xxxxxxxxxxxxxxxxxxxxxxxx}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:xxxxxxxxxxxxxxxxxxxxxxxx}

# ─────────────────────────────────────────────────────────────────────────────
# RazorpayX Payouts (Instant Doctor UPI Transfer)
# ─────────────────────────────────────────────────────────────────────────────
razorpayx.key.id=${RAZORPAYX_KEY_ID:}
razorpayx.key.secret=${RAZORPAYX_KEY_SECRET:}
razorpayx.account.number=${RAZORPAYX_ACCOUNT_NUMBER:}

